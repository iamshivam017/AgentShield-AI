name: CI

on:
  push:
    branches: [main, buildathon-production]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Generate ephemeral test credentials
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DEMO_USER_PASSWORD=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
          echo "RAZORPAY_WEBHOOK_SECRET=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API
        run: python -m pip install -e 'services/api[dev]'
      - name: Lint
        working-directory: services/api
        run: ruff format --check app tests migrations && ruff check app tests migrations
      - name: Typecheck
        working-directory: services/api
        run: mypy app
      - name: Compile
        working-directory: services/api
        run: python -m compileall -q app tests migrations
      - name: Migrate clean database
        working-directory: services/api
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./migration-test.db
        run: alembic upgrade head
      - name: Test with coverage
        working-directory: services/api
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70
      - name: Audit Python dependencies
        run: pip-audit
      - name: Reproduce benchmark
        working-directory: services/api
        run: python -m app.ml.benchmark --output ../../docs/benchmark-results-ci.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm run lint
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        run: npm test -- --run
      - working-directory: apps/web
        run: npm run build
      - working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Generate ephemeral test credentials
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DEMO_USER_PASSWORD=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
          echo "RAZORPAY_WEBHOOK_SECRET=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -e services/api
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start API
        working-directory: services/api
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./agentshield-e2e.db
          CORS_ORIGINS: http://127.0.0.1:3000
        run: uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
      - name: Wait for API
        run: for i in {1..60}; do curl -fsS http://127.0.0.1:8000/health/ready && exit 0; sleep 1; done; exit 1
      - working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run e2e
      - name: Print API log on failure
        if: failure()
        working-directory: services/api
        run: sed -n '1,240p' api.log
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: apps/web/test-results
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Generate ephemeral build credentials
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DEMO_USER_PASSWORD=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
      - name: Build production containers
        run: docker compose build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
