services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentshield
      POSTGRES_USER: agentshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentshield"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://agentshield:${POSTGRES_PASSWORD}@postgres:5432/agentshield
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?DEMO_USER_PASSWORD must be set}
      CORS_ORIGINS: http://localhost:3000
      RAZORPAY_TEST_MODE: "true"
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres-data:
