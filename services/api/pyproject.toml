[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield-api"
version = "0.1.0"
description = "Defense-first risk and trust API for agentic payments"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.40,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.10,<3",
  "httpx>=0.28,<1",
  "scikit-learn>=1.7,<2",
  "numpy>=2.2,<3",
  "prometheus-client>=0.22,<1",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "mypy>=1.17,<2",
  "ruff>=0.16.5,<1",
  "pip-audit>=2.9,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/core/config.py" = ["S105"]
"app/db/seed.py" = ["S106"]
"app/schemas/auth.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

[tool.coverage.run]
source = ["app"]
branch = true
